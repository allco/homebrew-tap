name: Test formulas

# Installs and tests every formula from this checkout, on macOS (arm64) and Linux (amd64).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: Homebrew/actions/setup-homebrew@main

      - name: Tap this checkout
        run: |
          tap="$(brew --repository)/Library/Taps/allco/homebrew-tap"
          rm -rf "$tap"
          mkdir -p "$(dirname "$tap")"
          ln -s "$GITHUB_WORKSPACE" "$tap"

      - name: Install, test and audit
        run: |
          for f in Formula/*.rb; do
            name=$(basename "$f" .rb)
            brew install "allco/tap/$name"
            brew test "allco/tap/$name"
            brew audit --strict "allco/tap/$name" || echo "::warning::audit of $name failed"
            "$(brew --prefix)/bin/$name" --version
          done
